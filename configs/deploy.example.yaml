# deploy.yaml — everything Shipwick needs to run your application.
# Only `name` and `image` (or `build` in its place) are required.
#
# A built frontend needs no container: name the folder instead of an image and
# Caddy serves it as it is. Only `name`, `static` and `domain` then apply, with
# `aliases` and `redirects`; run the build before `shipwick deploy`.
#   name: web
#   static: dist/
#   domain: example.com
# A single-page application answers every path that names no file with one page:
#   static: {dir: dist/, fallback: index.html}

# Lowercase letters, digits and dashes. Identifies the application on the server.
name: my-api

# Any image reference Docker understands. For a private registry, give the
# server a credential once: shipwick registry login ghcr.io --username <name>
# Pin a version tag: deployments are recorded by it (1.4.2 here).
image: ghcr.io/company/my-api:1.4.2

# No registry? Build the image on your machine instead: `shipwick deploy` runs
# docker build here, for the server's architecture, and sends the image to the
# server. Paths are relative to this file. Replaces `image`.
# build: .
# build:
#   context: .               # default: the directory of this file
#   dockerfile: Dockerfile   # default; relative to the context

# Run something other than the image's default: these replace its ENTRYPOINT,
# CMD and USER. A string is one argument; use a list for several. Nothing is
# split on spaces or passed through a shell.
# entrypoint: ["dotnet"]
# command: ["App.dll", "--urls", "http://0.0.0.0:8080"]
# user: "1000:1000"

# The port your application listens on inside the container. It is never
# published on the host; the reverse proxy reaches it over a private network.
# Required when `domain` or `health` is set.
port: 8080

# Public hostname. Shipwick configures Caddy to serve it over HTTPS.
domain: api.example.com

# More hostnames served exactly like `domain`, and hostnames redirected to it
# (308, same path and query; below `path`, if the application has one) — www,
# an old domain. Each gets a certificate.
# `domain` and aliases may be a wildcard, "*.example.com", when the agent has
# a Cloudflare API token or you supplied a certificate that covers it
# (shipwick cert set).
# aliases: [api2.example.com]
# redirects: [www.api.example.com]

# Serve only one path of the domain, and everything under it; another
# application takes another path, or the rest. The longest path wins.
# path: /api

# What the proxy does for this application besides passing requests on.
# Every path here is the path as the visitor asks for it.
# proxy:
#   strip_prefix: true              # the application sees /users for /api/users; needs path
#   headers:                        # set on every response
#     X-Frame-Options: DENY
#     Strict-Transport-Security: max-age=31536000
#   basic_auth:
#     - path: /api/admin            # optional; without it, the whole application
#       username: admin
#       password: ${ADMIN_PASSWORD} # a secret, filled in like an env value
#   redirects:
#     - from: /api/old
#       to: /api/new                # or an https:// URL
#       status: 308                 # 301, 302, 307 or 308; default 308

# Number of identical containers to run. Default: 1.
replicas: 2

# Environment variables. Values are stored on the server, never logged, and
# masked in API responses. ${NAME} is filled in when you deploy, so that secrets
# never have to be in this file: by the CLI from its environment or --env-file,
# else by the agent from the secrets stored with `shipwick secret set NAME`.
# $${NAME} is a literal ${NAME}.
# Other applications on the server are reached by name: postgres:5432.
env:
  DATABASE_URL: postgres://app:${DATABASE_PASSWORD}@postgres:5432/app
  LOG_LEVEL: info

# HTTP health check. A replica is healthy when `path` answers 2xx.
#
# Deploying: new replicas get start_period + interval × retries (30s here) to
# answer once; if they never do, the deployment fails and the old version
# keeps running. Slow starter — a JVM, a migration on boot? Set start_period.
#
# Running: a replica that fails `retries` checks in a row is restarted, and
# gets the same time to come up again.
#
# Not HTTP? Use exactly one of path, tcp or command:
#   tcp: 5432                                  # the port accepts a connection
#   command: ["pg_isready", "-U", "postgres"]  # exit 0 inside the replica
health:
  path: /health
  interval: 10s # default 10s
  timeout: 3s   # default 3s
  retries: 3    # default 3
  # start_period: 1m   # extra time to come up before failed checks count (up to 30m)

# Per-replica limits. Omit for unlimited.
resources:
  cpu: 2        # cores; fractions allowed: 0.5
  memory: 1gb   # 128mb, 512mb, 1gb, ...

# What to do when a replica exits or turns unhealthy:
#   always (default) | on-failure (non-zero exit / out of memory only) | never
# Restarts back off (1s, 2s, 5s, 10s, 30s, then every 5m): no hot crash loops.
restart:
  policy: always

deploy:
  strategy: rolling

# Data that must outlive deployments — a database. Named volumes belong to the
# application and are kept across redeployments, rollbacks and delete. They
# need replicas: 1 and the recreate strategy: two versions on one volume is
# how data gets lost.
# volumes:
#   - name: data
#     path: /var/lib/postgresql/data

# Backups of the volumes, taken by the server on a schedule (five cron fields,
# UTC) and kept there and, when the agent has one, in an S3 bucket. `before`
# runs inside the running replica first — a dump, a checkpoint — and a non-zero
# exit fails the backup; `stop: true` stops the application while the archive
# is taken. `shipwick backups` lists them, `shipwick backups verify` proves
# that one restores. With `before_in: container` the command runs in a
# container of its own beside the replica and is ended at before_timeout; it
# reaches the replica as localhost and sees the volumes, not the replica's
# other files, so pg_dump needs `-h localhost` there.
# backups:
#   schedule: "0 3 * * *"
#   keep: 7       # successful backups kept; default 7, up to 365
#   before: ["pg_dump", "-U", "postgres", "-f", "/var/lib/postgresql/data/backup.sql", "app"]
#   before_timeout: 1h   # how long `before` may run; default 1h, up to 24h
#   before_in: replica   # replica (default) | container
#   stop: false   # default false

# Ports that are not HTTP, published on the server itself: a database reached
# from outside the server, a game server. Needs replicas: 1 and the recreate
# strategy: a server port has one holder. Published ports bypass the host
# firewall on most distributions; bind to a private address where you can.
# publish:
#   - port: 5432        # inside the container
#     host: 15432       # on the server; default: the same as port
#     address: 10.0.0.5 # default: every address of the server
#     protocol: tcp     # or udp

# rolling (default): replicas are replaced one at a time, the application keeps
# serving. recreate: the running version is stopped before the new one starts;
# required with volumes and publish.
#
# stop_timeout: how long a replica that is being stopped — replaced by a
# deployment, or by `shipwick stop` — gets to finish what it has in hand after
# SIGTERM, before it is killed. Default 10s, up to 10m. Raise it for WebSockets
# or long uploads; the application has to handle SIGTERM for the time to be of
# use.
# deploy:
#   strategy: recreate
#   stop_timeout: 2m

# Docker's init process in front of the image's own, in every container of
# the application: it passes SIGTERM on and reaps children. For a process that
# does not handle the signal as the container's first process — Node started
# as `node server.js` — and is otherwise killed when stop_timeout ends. Leave
# it out for an image that brings its own init (tini, s6-overlay).
# init: true

# Ship logs to a collector instead of the server's disk: json-file (default),
# local, syslog, journald, gelf, fluentd, awslogs or splunk, with the driver's
# own options. Addresses are scheme://host:port; no sockets or files on the
# server. `shipwick logs` keeps working through the copy Docker keeps locally.
# logging:
#   driver: gelf
#   options:
#     gelf-address: udp://logs.example.com:12201
#     tag: "{{.Name}}"

# Run from the new image, with the env above, after the pull and before any
# replica of the new version starts — database migrations. A non-zero exit
# fails the deployment before anything was touched. It runs next to the version
# still serving, so what it does must be compatible with that version.
# pre_deploy:
#   command: ["dotnet", "Migrate.dll"]
#   timeout: 10m # default 10m, up to 1h

# Commands on a schedule, each in a one-off container from this image with the
# env above (no volumes). Five cron fields, read in UTC. One run of a job at a
# time; `shipwick jobs` shows how they are doing.
# jobs:
#   - name: nightly-report
#     schedule: "0 3 * * *"
#     command: ["node", "report.js"]
#     timeout: 1h # default 1h, up to 24h
#   - name: cleanup
#     schedule: "*/15 * * * *"
#     command: ["sh", "-c", "find /tmp/cache -mmin +60 -delete"]
