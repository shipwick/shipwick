# Weekly, grouped: one pull request per ecosystem instead of one per package.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
    groups:
      go: { patterns: ["*"] }

  - package-ecosystem: npm
    directory: /dashboard
    schedule: { interval: weekly }
    groups:
      dashboard: { patterns: ["*"] }

  - package-ecosystem: docker
    directories: ["/", "/dashboard"]
    schedule: { interval: weekly }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
