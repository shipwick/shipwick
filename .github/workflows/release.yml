name: Release

# Pushing a tag publishes a release:
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# A tag with a suffix (v0.2.0-rc.1) becomes a pre-release: it never moves the
# images' "latest" tag and is not what the installer picks by default.
#
# Run by hand (Actions → Release → Run workflow), this is a dry run: everything
# is built exactly as for a release — binaries, packages, every image for both
# platforms, their digests, the notes — and nothing is published. The images
# go to a registry that lives inside the job and ends with it, so that their
# digests are read back the way a release reads them. Use it after changing
# this file, the Dockerfiles or the release scripts.
#
# What is published is signed, without a key: Sigstore issues a certificate
# to the identity GitHub gives this run — this file, at the tag — and the
# signatures are checked against exactly that identity before anything is
# published. A dry run signs too, as this file at the branch it was started
# from: an identity no verification of a release accepts. Provenance is
# attested by a release only; an attestation is kept by GitHub for good.
#
# How to cut a release, step by step: docs/releasing.md

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to pretend to release (dry run; nothing is published)
        default: v0.0.0-dryrun

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

env:
  VERSION: ${{ inputs.version || github.ref_name }}
  PUBLISH: ${{ github.event_name == 'push' }}
  # Who the signatures must be from: for the tag v0.8.0,
  # https://github.com/shipwick/shipwick/.github/workflows/release.yml@refs/tags/v0.8.0
  SIGNER: https://github.com/${{ github.workflow_ref }}
  SIGNER_ISSUER: https://token.actions.githubusercontent.com

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml

  assets:
    name: Release files
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      # Before anything is published: a release without notes is not a release.
      - name: CHANGELOG.md has notes for this version
        run: sh scripts/release-notes.sh "$VERSION"
      - name: Build
        run: sh scripts/build-release.sh "$VERSION"
      - name: The binary knows its version
        run: test "$(./dist/shipwick_linux_amd64 --version)" = "shipwick version $VERSION"
      - name: The package holds the agent of this version
        run: |
          dpkg-deb -x dist/shipwick-agent_amd64.deb package
          test "$(./package/usr/bin/shipwick-agent version)" = "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  images:
    name: Image (${{ matrix.image }})
    needs: [checks, assets]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # The identity to sign with, and leave to record provenance.
      id-token: write
      attestations: write
    # A dry run pushes here instead of to ghcr.io; a release leaves it idle.
    services:
      registry:
        image: registry:3
        ports: ["5000:5000"]
    env:
      REGISTRY: ${{ github.event_name == 'push' && 'ghcr.io' || 'localhost:5000' }}
    strategy:
      matrix:
        include:
          - image: agent
            context: .
            dockerfile: Dockerfile
            title: Shipwick agent
          - image: dashboard
            context: dashboard
            dockerfile: dashboard/Dockerfile
            title: Shipwick dashboard
          # Caddy with the Cloudflare DNS provider. It carries the release's
          # version like the other two, though its content changes only when
          # Dockerfile.caddy does: one tag to pin, one upgrade to reason about.
          - image: caddy
            context: .
            dockerfile: Dockerfile.caddy
            title: Shipwick reverse proxy (Caddy)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      # On the runner's network, where the dry run's registry listens.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver-opts: network=host
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # v0.2.0 → 0.2.0, 0.2 and latest; v0.2.0-rc.1 → 0.2.0-rc.1 only.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/shipwick/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.licenses=Apache-2.0
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ env.VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          # For each platform a bill of materials (SPDX, written by BuildKit
          # from the image's files) and the full record of the build. Both
          # are manifests of the list the tag points at, so the signature of
          # the list covers them.
          sbom: true
          provenance: mode=max
      # Read back from the registry, not taken from the build: these lines say
      # what a server that pulls the tag is given. `shipwick server bundle`
      # and the installer hold images against them.
      - name: Digests of what was pushed
        id: digests
        run: |
          sh scripts/image-digests.sh "$REGISTRY/shipwick/${{ matrix.image }}:${VERSION#v}" \
            "ghcr.io/shipwick/${{ matrix.image }}:${VERSION#v}" > "image-digests-${{ matrix.image }}.txt"
          cat "image-digests-${{ matrix.image }}.txt"
          echo "index=$(awk '$2 == "index" { print $3 }' "image-digests-${{ matrix.image }}.txt")" >> "$GITHUB_OUTPUT"
      # No major tag to follow: the installer is pinned to a release, which
      # also decides the cosign it installs.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # By digest: the manifest list, which is what a tag resolves to and what
      # image-digests.txt calls the index. A tag can be moved; this cannot.
      - name: Sign the image
        env:
          IMAGE: ${{ env.REGISTRY }}/shipwick/${{ matrix.image }}@${{ steps.digests.outputs.index }}
        run: |
          cosign sign --yes "$IMAGE"
          cosign verify "$IMAGE" --certificate-identity "$SIGNER" --certificate-oidc-issuer "$SIGNER_ISSUER" > /dev/null
      # Kept by GitHub and next to the image: which commit, which workflow,
      # which run. No storage record: that is an inventory for organizations,
      # and would need a permission of its own.
      - name: Provenance of the image
        if: env.PUBLISH == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/shipwick/${{ matrix.image }}
          subject-digest: ${{ steps.digests.outputs.index }}
          push-to-registry: true
          create-storage-record: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: image-digests-${{ matrix.image }}
          path: image-digests-${{ matrix.image }}.txt
          if-no-files-found: error

  publish:
    name: GitHub release
    # Last, and only if the images exist: a release whose compose file points
    # at images that were never pushed would break every new installation.
    needs: [assets, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # The identity to sign with, and leave to record provenance.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist
      - name: The files are the ones that were built
        run: cd dist && sha256sum -c checksums.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: image-digests-*
          path: digests
          merge-multiple: true
      # The one file of a release that cannot exist before its images do. It
      # is listed in checksums.txt like the rest, so that what vouches for the
      # installer vouches for the images too.
      - name: The digests of the images join the release's files
        run: |
          cat digests/image-digests-agent.txt digests/image-digests-caddy.txt digests/image-digests-dashboard.txt > dist/image-digests.txt
          test "$(grep -c ' index sha256:' dist/image-digests.txt)" -eq 3
          test "$(grep -c ' config sha256:' dist/image-digests.txt)" -eq 6
          cd dist
          sha256sum image-digests.txt >> checksums.txt
          sha256sum -c checksums.txt
          cat image-digests.txt
      # The manifests winget installs the CLI from, written from checksums.txt
      # here, where it is complete, so that they are a file of the release
      # listed in it and signed with the rest. winget gets releases only: a
      # pre-release makes none. A dry run makes them for its version without
      # the suffix, so that the step is tried before a tag depends on it.
      - name: The winget manifests join the release's files
        run: |
          version="$VERSION"
          [ "$PUBLISH" = true ] || version="${VERSION%%-*}"
          case "$version" in *-*) echo "a pre-release has no winget manifests"; exit 0 ;; esac
          SHIPWICK_CHECKSUMS=dist/checksums.txt sh packaging/winget/update-manifests.sh "$version"
          zip -j dist/winget-manifests.zip "packaging/winget/manifests/s/Shipwick/Shipwick/${version#v}"/*.yaml
          cd dist && sha256sum winget-manifests.zip >> checksums.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: winget-manifests
          path: dist/winget-manifests.zip
          if-no-files-found: ignore
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # One signature for the whole release: checksums.txt names every file,
      # the digests of the images among them, and is complete only now. The
      # bundle holds the signature, the certificate and the transparency
      # log's entry; it is a file of the release and, being the signature of
      # checksums.txt, the one file that is not listed in it.
      - name: Sign checksums.txt
        run: |
          cosign sign-blob --yes --bundle checksums.txt.sigstore.json dist/checksums.txt
          cosign verify-blob --bundle checksums.txt.sigstore.json \
            --certificate-identity "$SIGNER" --certificate-oidc-issuer "$SIGNER_ISSUER" dist/checksums.txt
          mv checksums.txt.sigstore.json dist/
      # One attestation whose subjects are the files checksums.txt lists.
      - name: Provenance of the release's files
        if: env.PUBLISH == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: dist/checksums.txt
      - name: Release notes from CHANGELOG.md
        run: sh scripts/release-notes.sh "$VERSION" > notes.md
      - name: Publish
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$VERSION" dist/* \
            --verify-tag --title "$VERSION" --notes-file notes.md $prerelease
      - name: Dry run — this is what a release would have published
        if: env.PUBLISH != 'true'
        run: |
          ls -l dist
          echo "--- notes"
          cat notes.md

  winget:
    name: winget
    # Once the release exists, for releases only: microsoft/winget-pkgs takes
    # no pre-releases. A dry run goes as far as the validation.
    needs: publish
    if: github.event_name != 'push' || !contains(github.ref_name, '-')
    # winget and wingetcreate run on Windows, and wingetcreate on x64 only.
    runs-on: windows-latest
    env:
      # wingetcreate reads its token from here; given on the command line it
      # may be logged. Empty when the secret is not set, and nothing is
      # submitted then: the manifests are a file of the release, and
      # packaging/winget/README.md says how to submit them by hand.
      WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: winget-manifests
      # Unpacked into the directory the repository keeps a version in, which
      # is what both tools take.
      - name: The manifests of the release
        id: manifests
        run: |
          $version = $env:VERSION
          if ($env:PUBLISH -ne 'true') { $version = $version.Split('-')[0] }
          $version = $version.TrimStart('v')
          $dir = "manifests/s/Shipwick/Shipwick/$version"
          Expand-Archive winget-manifests.zip -DestinationPath $dir
          Get-ChildItem $dir | Format-Table Name, Length
          "dir=$dir" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
      # GitHub's Windows images carry no winget: App Installer comes from the
      # Store, and the images leave it out. Microsoft's module installs it
      # without the Store, the way its documentation gives for a Windows
      # Sandbox. The module comes from the PowerShell Gallery on every run,
      # and the gallery is not always there on the first try.
      - name: winget
        run: |
          if (Get-Command winget -ErrorAction SilentlyContinue) { winget --version; exit 0 }
          foreach ($attempt in 1..3) {
            try { Install-Module Microsoft.WinGet.Client -Force -Scope CurrentUser -ErrorAction Stop; break }
            catch { if ($attempt -eq 3) { throw }; Write-Host "Install-Module failed ($_); trying again in 20 seconds"; Start-Sleep 20 }
          }
          Repair-WinGetPackageManager -Force
          winget --version
      # The check the repository's automation runs first.
      - name: winget validate
        env:
          DIR: ${{ steps.manifests.outputs.dir }}
        run: winget validate --manifest $env:DIR
      - name: Nothing is submitted without WINGET_TOKEN
        if: env.PUBLISH == 'true' && env.WINGET_CREATE_GITHUB_TOKEN == ''
        run: Write-Host "The WINGET_TOKEN secret is not set. winget-manifests.zip is a file of the release; packaging/winget/README.md says how to submit it by hand."
      # wingetcreate validates the manifests once more, forks winget-pkgs
      # under the token's account when that account has none, pushes a branch
      # to the fork and opens the pull request from it. The repository asks
      # the title to say whether the package is new; it is new as long as it
      # has no directory there. The tool is the current one, as Microsoft's
      # own workflows take it: the repository's rules move, and the tool with
      # them; a pinned one is refused sooner or later.
      - name: Submit to microsoft/winget-pkgs
        if: env.PUBLISH == 'true' && env.WINGET_CREATE_GITHUB_TOKEN != ''
        env:
          DIR: ${{ steps.manifests.outputs.dir }}
          PACKAGE_VERSION: ${{ steps.manifests.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/microsoft/winget-pkgs/contents/manifests/s/Shipwick/Shipwick --silent 2>$null
          $title = if ($LASTEXITCODE -eq 0) { "Update: Shipwick.Shipwick version $env:PACKAGE_VERSION" } else { "New package: Shipwick.Shipwick version $env:PACKAGE_VERSION" }
          curl.exe -fsSL -o wingetcreate.exe https://aka.ms/wingetcreate/latest
          if ($LASTEXITCODE -ne 0) { throw "wingetcreate could not be downloaded." }
          .\wingetcreate.exe submit --prtitle $title --no-open $env:DIR
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
