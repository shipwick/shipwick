name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs all of this before it publishes anything.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: gofmt
        run: test -z "$(gofmt -l agent cli pkg caddy)" || { gofmt -l agent cli pkg caddy; exit 1; }
      - name: go vet
        run: |
          go vet ./...
          go vet -tags integration ./agent/internal/docker/
          cd caddy && go vet ./...
      - name: go mod tidy is a no-op
        run: |
          go mod tidy && git diff --exit-code go.mod go.sum
          cd caddy && go mod tidy && git diff --exit-code go.mod go.sum
      - name: Known vulnerabilities in dependencies
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      # The race detector needs cgo, which is why it runs here and not on
      # every developer machine.
      - name: Unit tests (race detector)
        run: |
          go test -race -count=1 ./...
          cd caddy && go test -race -count=1 ./...

      # Real container lifecycle against the runner's Docker daemon.
      - name: Integration tests
        run: go test -tags integration -count=1 -run Integration ./agent/internal/docker/

      - name: Cross-compile
        run: |
          for target in linux/amd64 linux/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -o /dev/null ./agent/cmd/shipwick-agent
          done
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -o /dev/null ./cli/cmd/shipwick
          done

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  images:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the agent image
        run: docker build -t ghcr.io/shipwick/agent:ci .
      - name: The agent image answers for itself
        run: docker run --rm ghcr.io/shipwick/agent:ci version
      - name: Build the dashboard image
        run: docker build -t ghcr.io/shipwick/dashboard:ci dashboard/
      - name: Build the proxy image
        run: docker build -t ghcr.io/shipwick/caddy:ci -f Dockerfile.caddy .
      - name: The proxy image has the Cloudflare module
        run: docker run --rm ghcr.io/shipwick/caddy:ci caddy list-modules | grep -x dns.providers.cloudflare
      - name: The proxy image has Shipwick's source of replicas
        run: docker run --rm ghcr.io/shipwick/caddy:ci caddy list-modules | grep -x http.reverse_proxy.upstreams.shipwick
      # caddy/ is compiled against the Caddy it is built into.
      - name: caddy/go.mod names the Caddy the image is built from
        run: |
          version=$(sed -n 's/^ARG CADDY_VERSION=//p' Dockerfile.caddy)
          grep -qx "	github.com/caddyserver/caddy/v2 v$version" caddy/go.mod
      - name: Compose files are valid
        run: |
          docker compose config --quiet
          SHIPWICK_AGENT_TOKEN=ci docker compose -f configs/compose.production.yml config --quiet
          docker compose -f packaging/linux/compose.yml config --quiet

  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck -s sh scripts/*.sh packaging/winget/*.sh packaging/linux/*.sh

  packages:
    name: Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build the .deb and the .rpm
        run: sh scripts/build-packages.sh v0.0.0-ci
      # Installed where they are meant for: the files, the settings file with
      # its token, and an agent that runs and was not started.
      - name: The .deb installs on Debian
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" debian:stable-slim sh -ec '
            dpkg -i /dist/shipwick-agent_amd64.deb
            test "$(shipwick-agent version)" = v0.0.0-ci
            test "$(stat -c %a /etc/shipwick/agent.env)" = 600
            grep -Eq "^SHIPWICK_AGENT_TOKEN=[0-9a-f]{64}$" /etc/shipwick/agent.env
            test -f /usr/lib/systemd/system/shipwick-agent.service
            dpkg -r shipwick-agent'
      - name: The .rpm installs on Rocky Linux
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" rockylinux/rockylinux:9 sh -ec '
            rpm -i /dist/shipwick-agent_amd64.rpm
            test "$(shipwick-agent version)" = v0.0.0-ci
            test "$(stat -c %a /etc/shipwick/agent.env)" = 600
            grep -Eq "^SHIPWICK_AGENT_TOKEN=[0-9a-f]{64}$" /etc/shipwick/agent.env
            test -f /usr/lib/systemd/system/shipwick-agent.service
            rpm -e shipwick-agent'
