name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs all of this before it publishes anything.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: gofmt
        run: test -z "$(gofmt -l agent cli pkg caddy)" || { gofmt -l agent cli pkg caddy; exit 1; }
      - name: go vet
        run: |
          go vet ./...
          go vet -tags integration ./agent/internal/docker/
          cd caddy && go vet ./...
      - name: go mod tidy is a no-op
        run: |
          go mod tidy && git diff --exit-code go.mod go.sum
          cd caddy && go mod tidy && git diff --exit-code go.mod go.sum
      - name: Known vulnerabilities in dependencies
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      # The race detector needs cgo, which is why it runs here and not on
      # every developer machine.
      - name: Unit tests (race detector)
        run: |
          go test -race -count=1 ./...
          cd caddy && go test -race -count=1 ./...

      # Real container lifecycle against the runner's Docker daemon.
      - name: Integration tests
        run: go test -tags integration -count=1 -run Integration ./agent/internal/docker/

      - name: Cross-compile
        run: |
          for target in linux/amd64 linux/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -o /dev/null ./agent/cmd/shipwick-agent
          done
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -o /dev/null ./cli/cmd/shipwick
          done

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  images:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the agent image
        run: docker build -t ghcr.io/shipwick/agent:ci .
      - name: The agent image answers for itself
        run: docker run --rm ghcr.io/shipwick/agent:ci version
      - name: Build the dashboard image
        run: docker build -t ghcr.io/shipwick/dashboard:ci dashboard/
      - name: Build the proxy image
        run: docker build -t ghcr.io/shipwick/caddy:ci -f Dockerfile.caddy .
      - name: The proxy image has the Cloudflare module
        run: docker run --rm ghcr.io/shipwick/caddy:ci caddy list-modules | grep -x dns.providers.cloudflare
      - name: The proxy image has Shipwick's source of replicas
        run: docker run --rm ghcr.io/shipwick/caddy:ci caddy list-modules | grep -x http.reverse_proxy.upstreams.shipwick
      # caddy/ is compiled against the Caddy it is built into.
      - name: caddy/go.mod names the Caddy the image is built from
        run: |
          version=$(sed -n 's/^ARG CADDY_VERSION=//p' Dockerfile.caddy)
          grep -qx "	github.com/caddyserver/caddy/v2 v$version" caddy/go.mod
      - name: Compose files are valid
        run: |
          docker compose config --quiet
          SHIPWICK_AGENT_TOKEN=ci docker compose -f configs/compose.production.yml config --quiet
          docker compose -f packaging/linux/compose.yml config --quiet
          SHIPWICK_AGENT_TOKEN=ci docker compose -f configs/compose.production.yml -f configs/compose.socket-proxy.yml config --quiet
          SHIPWICK_AGENT_TOKEN=ci XDG_RUNTIME_DIR=/run/user/1000 docker compose -f configs/compose.production.yml -f configs/compose.rootless.yml config --quiet

  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck -s sh scripts/*.sh packaging/winget/*.sh packaging/linux/*.sh

  # The four jobs below are the wide ones. A pull request runs one cell of
  # the installer's; main and a release run all of them. What each cell proves
  # and what it cannot: CONTRIBUTING.md, "What CI runs where".

  # The installer of this commit installs the latest release, with each
  # distribution's own sh, awk, coreutils and downloader, against a daemon of
  # its own (scripts/test-install.sh). The distribution is a container: its
  # userland is tested, not its kernel and not its packaging of Docker.
  installer:
    name: Installer on ${{ matrix.distribution }} (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["ubuntu-24.04", "ubuntu-24.04-arm"]') }}
        distribution: ${{ fromJSON(github.event_name == 'pull_request' && '["alpine:latest"]' || '["debian:12", "debian:13", "ubuntu:22.04", "ubuntu:24.04", "ubuntu:26.04", "rockylinux/rockylinux:8", "rockylinux/rockylinux:9", "rockylinux/rockylinux:10", "fedora:latest", "alpine:latest"]') }}
    steps:
      - uses: actions/checkout@v7
      - name: Install, then upgrade
        env:
          DISTRIBUTION: ${{ matrix.distribution }}
        run: sh scripts/test-install.sh "$DISTRIBUTION"

  # The same with the Engine a distribution packages itself instead of the
  # current one. Debian 12's is 20.10 and comes without the Compose plugin,
  # so the plugin is the current one there; 26.1, which Debian 13 packages,
  # with the Compose that Docker's image of it carries.
  installer-engines:
    name: Installer on ${{ matrix.distribution }}, Docker ${{ matrix.docker }}
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - distribution: debian:12
            docker: "20.10"
            client: latest
          - distribution: debian:13
            docker: "26.1"
            client: ""
    steps:
      - uses: actions/checkout@v7
      - name: Install, then upgrade
        env:
          DISTRIBUTION: ${{ matrix.distribution }}
          SHIPWICK_TEST_DOCKER: ${{ matrix.docker }}
          SHIPWICK_TEST_CLIENT: ${{ matrix.client }}
        run: sh scripts/test-install.sh "$DISTRIBUTION"

  # The integration tests against the Docker versions servers still run:
  # 20.10 is what Debian 12 packages and 26.1 what Debian 13 does, 28 and 29
  # are Docker's own last two. The daemon is Docker's image of that version,
  # on the runner's kernel.
  docker-versions:
    name: Docker ${{ matrix.docker }} (${{ matrix.runner }})
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        docker: ["20.10", "26.1", "28", "29"]
    services:
      docker:
        image: docker:${{ matrix.docker }}-dind
        env:
          DOCKER_TLS_CERTDIR: ""
        ports: ["2375:2375"]
        options: --privileged
    env:
      DOCKER_HOST: tcp://127.0.0.1:2375
      DOCKER_VERSION: ${{ matrix.docker }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: The daemon is of the version this cell names
        run: |
          for _ in $(seq 60); do
            docker version --format '{{.Server.Version}}' > version.txt 2>/dev/null && break
            sleep 1
          done
          cat version.txt
          grep -q "^$DOCKER_VERSION\." version.txt
      # The tests skip when no daemon answers, which here would be a cell
      # that passed without testing anything.
      - name: Integration tests
        run: |
          go test -tags integration -count=1 -v -run Integration ./agent/internal/docker/ > tests.txt 2>&1 || { cat tests.txt; exit 1; }
          grep -E '^(--- |ok|FAIL)' tests.txt
          ! grep -q '^--- SKIP' tests.txt

  # The same tests against the daemon and the kernel of GitHub's other Ubuntu
  # images, and on arm64: the cells in which the kernel is not the one every
  # other job runs on. ubuntu-24.04 on amd64 is the Go job above.
  integration:
    name: Integration (${{ matrix.runner }})
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-22.04-arm, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Docker and kernel
        run: |
          docker version --format 'Docker {{.Server.Version}}'
          uname -srm
      - name: Integration tests
        run: |
          go test -tags integration -count=1 -v -run Integration ./agent/internal/docker/ > tests.txt 2>&1 || { cat tests.txt; exit 1; }
          grep -E '^(--- |ok|FAIL)' tests.txt
          ! grep -q '^--- SKIP' tests.txt

  packages:
    name: Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build the .deb and the .rpm
        run: sh scripts/build-packages.sh v0.0.0-ci
      # Installed where they are meant for: the files, the settings file with
      # its token, and an agent that runs and was not started.
      - name: The .deb installs on Debian
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" debian:stable-slim sh -ec '
            dpkg -i /dist/shipwick-agent_amd64.deb
            test "$(shipwick-agent version)" = v0.0.0-ci
            test "$(stat -c %a /etc/shipwick/agent.env)" = 600
            grep -Eq "^SHIPWICK_AGENT_TOKEN=[0-9a-f]{64}$" /etc/shipwick/agent.env
            test -f /usr/lib/systemd/system/shipwick-agent.service
            dpkg -r shipwick-agent'
      - name: The .rpm installs on Rocky Linux
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" rockylinux/rockylinux:9 sh -ec '
            rpm -i /dist/shipwick-agent_amd64.rpm
            test "$(shipwick-agent version)" = v0.0.0-ci
            test "$(stat -c %a /etc/shipwick/agent.env)" = 600
            grep -Eq "^SHIPWICK_AGENT_TOKEN=[0-9a-f]{64}$" /etc/shipwick/agent.env
            test -f /usr/lib/systemd/system/shipwick-agent.service
            rpm -e shipwick-agent'

  # An installation of each of the last two releases, put to use and then
  # upgraded to this commit; for the last one, the way back as well. It
  # installs releases and pulls their images, which is too much for every
  # pull request: on main, and before a release.
  upgrade:
    name: Upgrade from the last two releases
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Upgrade, and back
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t releases < <(gh release list --repo shipwick/shipwick --exclude-drafts --exclude-pre-releases --limit 2 --json tagName --jq '.[].tagName')
          sh scripts/test-upgrade.sh --back "${releases[0]}"
          sh scripts/test-upgrade.sh "${releases[1]}"
