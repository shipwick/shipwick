# Local development stack.
#
#   docker compose up --build        (or: make dev)
#
#   Dashboard  http://localhost:3000      (token: dev-token-do-not-use-in-production)
#   Agent      http://localhost:9000
#   Proxy      http://localhost:8080  ·  https://localhost:8443
#
# Try a routed application without touching DNS — *.localhost resolves to this
# machine, and Caddy issues certificates for it from its own local CA:
#
#   domain: hello.localhost      →   curl -k https://hello.localhost:8443
#
# For a server, start from configs/compose.production.yml instead.

# Pinned so container and volume names do not depend on the checkout directory.
name: shipwick

services:
  agent:
    build:
      context: .
      args:
        VERSION: dev
    environment:
      # Development only. Production: generate one with `openssl rand -hex 32`.
      SHIPWICK_AGENT_TOKEN: ${SHIPWICK_AGENT_TOKEN:-dev-token-do-not-use-in-production}
      SHIPWICK_LOG_LEVEL: ${SHIPWICK_LOG_LEVEL:-debug}
      SHIPWICK_CADDY_ADMIN: unix//run/caddy/admin.sock
      # Optional: serve the agent API itself over HTTPS, e.g. agent.localhost
      SHIPWICK_AGENT_DOMAIN: ${SHIPWICK_AGENT_DOMAIN:-}
      # Optional: serve the dashboard through Caddy too, e.g. dashboard.localhost
      SHIPWICK_DASHBOARD_DOMAIN: ${SHIPWICK_DASHBOARD_DOMAIN:-}
      # Optional: a webhook told about deployment outcomes
      SHIPWICK_WEBHOOK_URL: ${SHIPWICK_WEBHOOK_URL:-}
      SHIPWICK_WEBHOOK_SECRET: ${SHIPWICK_WEBHOOK_SECRET:-}
      # Optional: backups encrypted, and sent to an S3-compatible bucket as well
      SHIPWICK_BACKUP_DIR: ${SHIPWICK_BACKUP_DIR:-}
      SHIPWICK_BACKUP_PASSPHRASE: ${SHIPWICK_BACKUP_PASSPHRASE:-}
      SHIPWICK_BACKUP_S3_ENDPOINT: ${SHIPWICK_BACKUP_S3_ENDPOINT:-}
      SHIPWICK_BACKUP_S3_BUCKET: ${SHIPWICK_BACKUP_S3_BUCKET:-}
      SHIPWICK_BACKUP_S3_ACCESS_KEY_ID: ${SHIPWICK_BACKUP_S3_ACCESS_KEY_ID:-}
      SHIPWICK_BACKUP_S3_SECRET_ACCESS_KEY: ${SHIPWICK_BACKUP_S3_SECRET_ACCESS_KEY:-}
      SHIPWICK_BACKUP_S3_REGION: ${SHIPWICK_BACKUP_S3_REGION:-}
      SHIPWICK_BACKUP_S3_PREFIX: ${SHIPWICK_BACKUP_S3_PREFIX:-}
      # Optional: an export of the whole server on a schedule, or this server as a standby
      SHIPWICK_EXPORT_SCHEDULE: ${SHIPWICK_EXPORT_SCHEDULE:-}
      SHIPWICK_EXPORT_KEEP: ${SHIPWICK_EXPORT_KEEP:-}
      SHIPWICK_STANDBY_SCHEDULE: ${SHIPWICK_STANDBY_SCHEDULE:-}
      # Optional: a Cloudflare API token, for certificates through the DNS
      # challenge (hostnames behind Cloudflare's proxy, wildcards)
      SHIPWICK_CLOUDFLARE_API_TOKEN: ${SHIPWICK_CLOUDFLARE_API_TOKEN:-}
      # Optional: the encryption key from here instead of the key file in the data directory
      SHIPWICK_ENCRYPTION_KEY: ${SHIPWICK_ENCRYPTION_KEY:-}
      SHIPWICK_ALERT_MEMORY_PERCENT: ${SHIPWICK_ALERT_MEMORY_PERCENT:-}
      SHIPWICK_ALERT_DISK_PERCENT: ${SHIPWICK_ALERT_DISK_PERCENT:-}
      # Optional: how long the output of ended containers is kept, and how much
      # of the disk it may take (14 days, 1gb; a size of 0 keeps nothing)
      SHIPWICK_LOG_RETENTION_DAYS: ${SHIPWICK_LOG_RETENTION_DAYS:-}
      SHIPWICK_LOG_RETENTION_SIZE: ${SHIPWICK_LOG_RETENTION_SIZE:-}
      # Optional: behind a proxy. The agent's own requests — webhook, bucket —
      # go through it; images are pulled by the Docker daemon, which has its
      # own setting (docs/handbook.md, "Behind a corporate proxy").
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      # Optional: certificate authorities of your own, a PEM file as this
      # container sees it (mounted in compose.override.yml); who is asked
      # whether a hostname points here; an ACME server of your own
      SHIPWICK_CA_FILE: ${SHIPWICK_CA_FILE:-}
      SHIPWICK_DNS_RESOLVERS: ${SHIPWICK_DNS_RESOLVERS:-}
      SHIPWICK_ACME_DIRECTORY: ${SHIPWICK_ACME_DIRECTORY:-}
      # Optional: people sign in to the dashboard with an OpenID Connect provider.
      # The redirect URL is for a dashboard on this machine (yarn dev):
      # http://localhost:3000/auth/callback; with SHIPWICK_DASHBOARD_DOMAIN leave it unset.
      SHIPWICK_OIDC_ISSUER: ${SHIPWICK_OIDC_ISSUER:-}
      SHIPWICK_OIDC_CLIENT_ID: ${SHIPWICK_OIDC_CLIENT_ID:-}
      SHIPWICK_OIDC_CLIENT_SECRET: ${SHIPWICK_OIDC_CLIENT_SECRET:-}
      SHIPWICK_OIDC_SCOPES: ${SHIPWICK_OIDC_SCOPES:-}
      SHIPWICK_OIDC_GROUPS_CLAIM: ${SHIPWICK_OIDC_GROUPS_CLAIM:-}
      SHIPWICK_OIDC_NAME_CLAIM: ${SHIPWICK_OIDC_NAME_CLAIM:-}
      SHIPWICK_OIDC_TENANTS: ${SHIPWICK_OIDC_TENANTS:-}
      # Optional: "off" stops the agent's daily question to github.com about a newer release
      SHIPWICK_UPDATE_CHECK: ${SHIPWICK_UPDATE_CHECK:-}
      SHIPWICK_OIDC_REDIRECT_URL: ${SHIPWICK_OIDC_REDIRECT_URL:-}
      # Docker, through the filtered socket of the socket-proxy service.
      DOCKER_HOST: unix:///run/docker-proxy/docker.sock
    ports:
      # Loopback only: the API is plain HTTP and must not face the network.
      # On Docker before 28 this port makes the API reachable from application
      # containers, by design here: Docker forwards it over the network the
      # agent joins for health checks, and the agent listens there to keep the
      # port working (handbook, "Who can reach the API"). Production publishes
      # no port.
      - "127.0.0.1:9000:9000"
    volumes:
      - agent-data:/var/lib/shipwick
      - caddy-admin:/run/caddy
      - docker-proxy:/run/docker-proxy
    depends_on: [socket-proxy]
    networks:
      # The API is reached on this network and no other: no application is on
      # it. The agent joins the application network by itself, for health
      # checks, and does not listen there.
      - shipwick-control
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
    restart: unless-stopped

  # The agent reaches Docker through this, in development as on a server. The
  # service is the one of configs/compose.production.yml, line for line, so
  # that a call the allow-list lacks is refused here first; a test in
  # agent/internal/docker holds the two copies together. What was refused:
  # docker compose logs socket-proxy
  socket-proxy:
    # https://github.com/wollomatic/socket-proxy — an allow-list of method and
    # path, one regular expression per method; what is not listed is refused
    # with 403 and logged. It holds the Docker socket, which is root on this
    # server; the agent holds only the socket this service makes.
    image: ${SHIPWICK_SOCKET_PROXY_IMAGE:-wollomatic/socket-proxy:1.13.1}
    command:
      # A unix socket in a volume only the agent shares, like Caddy's admin
      # API: on a TCP port it would be one more thing to keep application
      # containers away from.
      - -proxysocketendpoint=/run/docker-proxy/docker.sock
      - -proxysocketendpointfilemode=0600
      - -loglevel=${SHIPWICK_SOCKET_PROXY_LOG_LEVEL:-INFO}
      # The agent mounts named volumes and nothing else. This refuses every
      # bind mount — in `Binds`, in `Mounts`, and in a volume created with
      # `o=bind`: the one directory it allows does not exist.
      - -allowbindmountfrom=/var/empty/shipwick
      # The calls the agent makes, and no other. Every path may carry the API
      # version in front. A backslash at the end of a line joins it to the
      # next: each list is one regular expression. A call the agent did not
      # make before needs its line here and its row in the handbook's table;
      # scripts/test-socket-proxy.sh fails when the proxy refused the agent.
      #
      #   _ping                    is the daemon there, and which API version
      - "-allowHEAD=/_ping"
      #   info                     the server's status; the daemon's proxy, when a pull fails
      #   system/df                the sizes of volumes
      #   containers/json          the containers of an application; the reverse proxy's
      #   containers/<id>/json     state, address, exit code; the agent's own container
      #   containers/<id>/logs     logs, followed or read; Caddy's access log
      #   containers/<id>/stats    CPU and memory
      #   containers/<id>/archive  a volume read for a backup or an export
      #   exec/<id>/json           the exit code of a command
      #   images/json              tags to clean up; layers a build need not send
      #   images/get               an image written into an export
      #   images/<name>/json       is the image here
      #   networks/<name>          do the two networks exist
      #   volumes                  the volumes of applications
      - "-allowGET=/_ping|/(v1[.][0-9]+/)?(info\
        |system/df\
        |containers/json\
        |containers/[a-zA-Z0-9_.-]+/(json|logs|stats|archive)\
        |exec/[a-f0-9]+/json\
        |images/json\
        |images/get\
        |images/.+/json\
        |networks/[a-zA-Z0-9_.-]+\
        |volumes)"
      #   auth                       a registry login is tried before it is stored
      #   containers/create          replicas, jobs, the containers of backups
      #   containers/<id>/start, stop
      #   containers/<id>/wait       a job's end
      #   containers/<id>/exec       health checks by command, `before` of a backup, static folders
      #   exec/<id>/start            the same: this starts what the line above prepared
      #   images/create              pulling an image; nothing is ever imported or built
      #   images/load                an image the CLI built and sent; an import
      #   images/<id>/tag            a tag a refused upload moved, pointed back at its image
      #   networks/create            the two networks, at the first start
      #   networks/<name>/connect, disconnect   a replica's names on the services network
      #   volumes/create             an application's volumes
      - "-allowPOST=/(v1[.][0-9]+/)?(auth\
        |containers/create\
        |containers/[a-zA-Z0-9_.-]+/(start|stop|wait|exec)\
        |exec/[a-f0-9]+/start\
        |images/create\
        |images/load\
        |images/.+/tag\
        |networks/create\
        |networks/[a-zA-Z0-9_.-]+/(connect|disconnect)\
        |volumes/create)"
      #   containers/<id>/archive  a restore; the files of a static application
      - "-allowPUT=/(v1[.][0-9]+/)?containers/[a-zA-Z0-9_.-]+/archive"
      #   containers/<id>          replicas replaced, jobs done
      #   images/<name>            images no deployment can go back to
      #   volumes/<name>           a restore, a deleted application's volumes
      - "-allowDELETE=/(v1[.][0-9]+/)?(containers/[a-zA-Z0-9_.-]+\
        |images/.+\
        |volumes/[a-zA-Z0-9_.-]+)"
    # Root inside the container, without a single capability: the socket
    # belongs to root, or to the user of a rootless daemon, who is root in
    # here. Running as nobody would need the number of the server's docker
    # group, which differs from one distribution to the next.
    user: "0:0"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    # No network at all: the only ways in and out are the two sockets.
    network_mode: none
    volumes:
      # SHIPWICK_DOCKER_SOCKET in .env for a daemon whose socket is elsewhere;
      # compose.rootless.yml points it at the rootless daemon's.
      - ${SHIPWICK_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - docker-proxy:/run/docker-proxy
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
    restart: unless-stopped

  caddy:
    # Caddy with the Cloudflare DNS provider: see Dockerfile.caddy.
    build:
      context: .
      dockerfile: Dockerfile.caddy
    # --resume: after a restart, come back with the last configuration the
    # agent loaded rather than the empty bootstrap one. (The agent would
    # notice and reload within seconds either way.)
    command: caddy run --config /etc/caddy/bootstrap.json --resume
    environment:
      # The agent's proxy, for the certificate authority and Cloudflare's API.
      # Requests to applications never go through it.
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
    configs:
      - source: caddy-bootstrap
        target: /etc/caddy/bootstrap.json
    ports:
      - "${SHIPWICK_HTTP_PORT:-8080}:80"
      - "${SHIPWICK_HTTPS_PORT:-8443}:443"
      - "${SHIPWICK_HTTPS_PORT:-8443}:443/udp" # HTTP/3
    volumes:
      - caddy-data:/data     # certificates: keep this volume
      - caddy-config:/config # autosaved configuration, for --resume
      - caddy-static:/srv/shipwick # the folders of static applications, put there by the agent
      # The admin API lives on a unix socket in a volume only the agent shares.
      # On a TCP port it would be open to every application container on the
      # network — and whoever can reach it controls all routing.
      - caddy-admin:/run/caddy
    networks:
      - shipwick
      - shipwick-services
      - shipwick-control
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    environment:
      # As seen from the dashboard's server side; the browser never talks to the agent.
      SHIPWICK_AGENT_URL: http://agent:9000
      # Several servers in this one dashboard: name=URL pairs, e.g.
      # "production=http://agent:9000,staging=https://agent.staging.example.com".
      # Set, it replaces SHIPWICK_AGENT_URL.
      SHIPWICK_AGENTS: ${SHIPWICK_AGENTS:-}
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - shipwick-control
    depends_on:
      - agent
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
    restart: unless-stopped

configs:
  # All Caddy needs to start with; the agent loads the real configuration.
  caddy-bootstrap:
    content: |
      {"admin": {"listen": "unix//run/caddy/admin.sock"}}

volumes:
  agent-data:
  caddy-data:
  caddy-config:
  caddy-admin:
  caddy-static:
  docker-proxy: # the filtered Docker socket, shared by the socket proxy and the agent

networks:
  # Applications and Caddy; the agent joins it by itself, for health checks.
  shipwick:
    name: shipwick
  # Replicas carry their application's name here while they are ready; Caddy
  # and other applications find them by it.
  shipwick-services:
    name: shipwick-services
  # The agent, Caddy and the dashboard, and nothing else: where the API is
  # reached. Named after the first: the agent derives it as "<network>-control".
  shipwick-control:
    name: shipwick-control
